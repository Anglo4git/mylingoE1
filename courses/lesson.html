<style>
/* ============================================================
   Player Mode (Lesson Mode) — light-first course player
   ============================================================ */
:root{--brand:#1959d1;--brand-dark:#0e45ae;--brand-soft:#eaf1fc;--success:#58cc02;--success-dark:#46a302;--success-soft:#e9f8df;--ink:#17212b;--muted:#4b5563;--line:#e5e7eb;--bg:#f7f9fc;--panel:#fff;--card:#fff;--ease-micro:cubic-bezier(0.25,0.1,0.25,1);--ease-release:cubic-bezier(0.34,1.56,0.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body.lesson-player{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
a{color:inherit}
.skip-link{position:absolute;left:8px;top:-48px;background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;text-decoration:none;z-index:1000;transition:top .15s ease}
.skip-link:focus{top:8px}
.slide:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Full-screen player mode (Agent NAV-STRIP): no branded site header,
   no bottom app-shell nav — this page is the fullscreen slide player.
   The chapter-trail is the only top chrome, acting as both a slide
   progress indicator and the player's "exit" affordance via the crumb
   link below it. It sits in a plain top strip, not a bordered site header. ---- */
.player-top{padding:calc(10px + env(safe-area-inset-top)) 16px 0}

/* ---- Chapter-trail strip: shows Lesson -> Watch -> Practice progress ---- */
.chapter-trail{max-width:820px;margin:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:0 0 12px}
.chapter-trail::-webkit-scrollbar{display:none}
.trail-item{flex:1 1 0;min-width:96px;display:flex;align-items:center;gap:8px;touch-action:manipulation;background:transparent;border:none;border-bottom:3px solid var(--line);color:var(--muted);font-size:12px;font-weight:800;padding:0 4px 10px;cursor:pointer;white-space:nowrap;transition:color .2s var(--ease-micro),border-color .2s var(--ease-micro)}
.trail-item .num{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);display:grid;place-items:center;font-size:10px;font-weight:900;flex:0 0 auto;transition:background .2s,color .2s}.trail-item .type-icon{font-size:12px;line-height:1;opacity:.95;display:inline-flex;align-items:center}.trail-item .type-icon svg{width:14px;height:14px;display:block;flex:0 0 auto}.trail-item.active .type-icon{opacity:1}
.trail-item.done .num{background:var(--success);color:#0b0c0d}
.trail-item .kind{font-size:12px;line-height:1}.trail-item.active{color:var(--brand);border-color:var(--brand)}
.trail-item.active .num{background:var(--brand);color:#fff}
.trail-item:hover{color:var(--ink)}

main{max-width:820px;margin:auto;padding:20px 16px calc(90px + env(safe-area-inset-bottom))}
.crumb{font-size:13px;color:var(--muted);margin:0 0 14px}
.crumb a{color:var(--brand);text-decoration:none;font-weight:700}
.course-id{display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.course-id .lvl-badge{color:var(--brand)}
.course-id .sep{color:var(--line);font-weight:600}
.course-id .unit-name{color:var(--muted);font-weight:700;text-transform:none;letter-spacing:0}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.chip{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.skipbtn{flex:0 0 auto;text-decoration:none;font-weight:800;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:8px 14px;min-height:36px;display:inline-flex;align-items:center;white-space:nowrap}
h1{margin:6px 0 8px;font-size:24px;color:var(--ink)}
.readtime{color:var(--muted);font-size:13px;margin:0 0 20px;display:flex;align-items:center;gap:6px}
.readtime svg{flex:0 0 auto}

/* ---- Slide viewport: exactly one slide of content at a time ---- */
.slide-viewport{position:relative}
.slide{animation:slideIn .3s var(--ease-micro)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.summary{font-size:17px;line-height:1.5;margin:0}
.examples{margin:0;padding:0;list-style:none}
.examples li{font-size:15px;line-height:1.5;padding:9px 0 9px 22px;position:relative;border-top:1px solid var(--line)}
.examples li:first-child{border-top:none}
.examples li::before{content:"";position:absolute;left:0;top:17px;width:8px;height:8px;border-radius:99px;background:var(--success)}
.terms{display:flex;gap:8px;flex-wrap:wrap}
/* Agent 15: forced-colors (Windows High Contrast) — the UA flattens backgrounds, so the active/done trail state and term chips need a non-colour cue */
@media (forced-colors:active){.trail-item .num{border:1px solid CanvasText}.trail-item.active{outline:3px solid Highlight;outline-offset:-3px;text-decoration:underline}.trail-item.done .num::after{content:"\2713";margin-left:2px}.term{border:1px solid CanvasText}}

.term{font-size:13px;font-weight:700;background:var(--success-soft);color:#2f6d06;border-radius:99px;padding:6px 12px}
.media img{max-width:100%;border-radius:12px;display:block}
/* Blog-style body content authored as rich HTML inside the lesson JSON

.lesson-content{font-size:16px;line-height:1.65}
.lesson-content h2{font-size:19px;margin:0 0 10px;color:var(--ink)}
.lesson-content h3{font-size:16px;margin:18px 0 8px;color:var(--ink)}
.lesson-content p{margin:0 0 12px}
.lesson-content ul,.lesson-content ol{margin:0 0 12px;padding-left:22px}
.lesson-content li{margin:0 0 6px}
.lesson-content strong{color:var(--ink)}
.lesson-content a{color:var(--brand);font-weight:700}
.lesson-content blockquote,.lesson-content .tutor-notice-box{margin:12px 0;padding:12px 14px;border-left:3px solid var(--brand);background:var(--panel);border-radius:0 10px 10px 0;color:var(--muted)}
.lesson-content img{max-width:100%;border-radius:12px;display:block;margin:12px 0}

/* ---- Video wrapper: standard YouTube 16:9 player ---- */
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-slide .video-wrap{position:relative}
.video-slide .video-wrap iframe{width:100%;height:100%;user-select:auto;-webkit-user-select:auto}
.video-lock{display:none}
.video-progress{margin:10px 0 0;padding:0;color:var(--muted);font-size:12px;font-weight:800}
.video-next-locked{display:block;flex:1 1 auto;text-align:center;padding:14px 18px;border-radius:999px;background:#e5e7eb;color:#4b5563;font-size:14px;font-weight:900;min-height:48px}

.video-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:13px;color:var(--brand);margin-top:10px}

.loading{text-align:center;color:var(--muted);padding:60px 20px}
.err{text-align:center;color:var(--muted);padding:50px 20px}
.err a{color:var(--brand);font-weight:800;text-decoration:none}

/* ---- Bottom nav bar: Back / Continue, sticky above safe area ---- */
.player-nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:20px 16px calc(16px + env(safe-area-inset-bottom));z-index:6}
.player-nav-inner{max-width:820px;margin:auto;display:flex;gap:10px}
.btn{display:block;flex:1 1 auto;text-align:center;text-decoration:none;font-weight:900;font-size:15px;padding:14px 30px;border-radius:999px;min-height:48px;box-sizing:border-box;transition:transform var(--dur-standard,220ms) var(--ease-release),box-shadow var(--dur-micro,120ms) var(--ease-micro),background-color var(--dur-micro,120ms) var(--ease-micro);border:0;cursor:pointer}

// Sanitizes lesson JSON's rich-text body_content before it hits innerHTML.
// This is a client-side allowlist safety net (defense in depth) — content
// should still be sanitized at authoring/import time (e.g. wp_kses_post()
// equivalent) before it ever lands in a lessons/<level>.json file.
var ALLOWED_TAGS={P:1,H2:1,H3:1,H4:1,STRONG:1,EM:1,B:1,I:1,UL:1,OL:1,LI:1,BR:1,A:1,BLOCKQUOTE:1,IMG:1,DIV:1,SPAN:1,CODE:1,PRE:1};
var ALLOWED_ATTRS={A:['href','title'],IMG:['src','alt'],DIV:['class'],SPAN:['class']};
function sanitizeHtml(html){
  if(!html || typeof html!=='string') return '';
  var doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
  var root=doc.body.firstChild;
  (function clean(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(child){
      if(child.nodeType===3) return; // text node: fine as-is
      if(child.nodeType!==1 || !ALLOWED_TAGS[child.tagName]){ child.remove(); return }
      Array.prototype.slice.call(child.attributes||[]).forEach(function(attr){
        var allowed=ALLOWED_ATTRS[child.tagName]||[];
        var isSafeHref=/^(https?:|mailto:|\/)/i.test(attr.value||'');
        if(allowed.indexOf(attr.name)===-1){ child.removeAttribute(attr.name); return }
        if((attr.name==='href'||attr.name==='src') && !isSafeHref){ child.removeAttribute(attr.name); return }
      });
      clean(child);
    });
  })(root);
  return root.innerHTML;
}

function fetchJson(url){
  return fetch(url,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json() });
}

function renderError(message){
  $('chapterTrail').innerHTML='';
  $('content').innerHTML='<div class="err"><p>'+esc(message)+'</p><p><a href="./index.html">Back to all courses</a> or <a href="../main/index.html">find my level</a>.</p></div>';
}

function estimateMinutes(revision){
  if(revision && revision.estimated_minutes != null && isFinite(Number(revision.estimated_minutes))){
    return Math.max(1, Math.round(Number(revision.estimated_minutes)));
  }
  var text=[revision && revision.summary]
    .concat((revision && revision.examples) || [])
    .concat((revision && revision.key_terms) || [])
    .filter(Boolean).join(' ');
  var words=text.trim().length ? text.trim().split(/\s+/).length : 0;
  return Math.max(1, Math.ceil(words/200));
}

function youtubeId(url){
  if(!url || typeof url!=='string') return null;
  var m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  return m ? m[1] : null;
}

// Builds the embeddable YouTube src URL for a given video id. Centralized
// here so the standard YouTube player/fullscreen parameters stay
// consistent everywhere a video is embedded. YouTube controls remain native
// so learners can use the normal YouTube fullscreen mode without cropping.
function youtubeEmbedSrc(vid){
  if(!vid) return '';
  var origin=(typeof location!=='undefined'&&location.origin)||''; return 'https://www.youtube.com/embed/'+encodeURIComponent(vid)+'?autoplay=1&mute=1&controls=1&disablekb=0&fs=1&iv_load_policy=3&rel=0&playsinline=1&enablejsapi=1'+(origin?'&origin='+encodeURIComponent(origin):'');
}

function splitIntoThreeTextSlides(html,revision){
  var clean=sanitizeHtml(html||'');
  var blocks=[];
  if(clean){
    var doc=new DOMParser().parseFromString('<div>'+clean+'</div>','text/html');
    var root=doc.body.firstChild;
    blocks=Array.prototype.map.call(root.childNodes,function(n){return n.outerHTML||n.textContent||''}).filter(function(x){return String(x).trim()});
  }
  var rev=revision||{};
  var examples=(rev.examples||[]).filter(Boolean);
  var terms=(rev.key_terms||[]).filter(Boolean);
  if(!blocks.length){
    var summary=rev.summary&&String(rev.summary).trim();
    if(summary) blocks.push('<p>'+esc(summary)+'</p>');
    if(examples.length) blocks.push('<h3>Examples</h3><ul>'+examples.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul>');
    if(terms.length) blocks.push('<h3>Key terms</h3><p>'+terms.map(function(t){return '<span class=\"term\">'+esc(t)+'</span>'}).join(' ')+'</p>');
  }
  var groups=[[],[],[]];
  if(blocks.length){
    blocks.forEach(function(block,i){groups[Math.min(2,Math.floor(i*3/blocks.length))].push(block)});
  }
  var labels=['1 · Intro & explanation','2 · Usage & examples','3 · More details'];
  return groups.map(function(group,i){
    if(!group.length){
      var fallback=i===1?(examples.length?'<h3>Usage & examples</h3><ul>'+examples.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul>':'<p>Use the explanation from slide 1 and try the lesson practice next.</p>'):(i===2?(terms.length?'<h3>More details</h3><p>'+terms.map(function(t){return '<span class=\"term\">'+esc(t)+'</span>'}).join(' ')+'</p>':'<h3>More details</h3><p>Review the key idea, then continue to practice.</p>'):'<p>Review this lesson introduction before continuing.</p>');
      group=[fallback];
    }
    return {label:labels[i],html:group.join('')};
  });
}

// Renders the "Watch" slide's media markup: the video wrapper (or its
// offline/broken-link fallback) plus any presentation image. Kept as a
// single function so both the initial render and the offline listener
// build the exact same markup.
function mediaEntries(lesson){
  function normalize(list, fallback){
    var arr=Array.isArray(list)?list:[];
    if(!arr.length && fallback) arr=[fallback];
    return arr.map(function(item){
      if(typeof item==='string') return {url:item,title:''};
      if(item&&typeof item==='object') return {url:item.url||item.src||'',title:item.title||item.label||''};
      return null;
    }).filter(function(x){return x&&x.url});
  }
  return {
    videos:normalize(lesson.video_urls||lesson.videos, lesson.youtube_url),
    audios:normalize(lesson.audio_urls||lesson.audios, lesson.audio_url)
  };
}
function renderMediaItem(entry,kind,title,isOnline,index){
  var safe=window.MylingoSafeUrl&&window.MylingoSafeUrl.isSafeMediaUrl(entry.url);
  if(!safe) return '<div class="card"><h2>'+esc(kind==='video'?'Video':'Audio')+'</h2><div class="video-fallback">This media link is not available.</div></div>';
  if(!isOnline) return '<div class="card"><h2>'+esc(kind==='video'?'Video':'Audio')+'</h2><div class="video-fallback">Media unavailable offline. Continue with the lesson text.</div></div>';
  if(kind==='video'){
    var vid=youtubeId(entry.url);
    if(vid) return '<div class="card video-card"><h2>'+esc(entry.title||'Video')+'</h2><div class="video-wrap"><iframe id="youtube-player-'+String(index||0)+'" src="'+esc(youtubeEmbedSrc(vid))+'" title="'+esc(entry.title||title)+' video" loading="eager" allow="autoplay; fullscreen; encrypted-media" allowfullscreen tabindex="0"></iframe><div class="video-lock" aria-hidden="true">Learning mode · YouTube player controls available</div></div><p class="video-progress" id="video-progress">Watch 90% to unlock Continue.</p></div>';
    return '<div class="card"><h2>'+esc(entry.title||'Video')+'</h2><video controls playsinline preload="metadata" style="width:100%;border-radius:14px;background:#000" src="'+esc(entry.url)+'"></video></div>';
  }
  return '<div class="card"><h2>'+esc(entry.title||'Audio lesson')+'</h2><audio controls preload="metadata" style="width:100%" src="'+esc(entry.url)+'"></audio></div>';
}

function quizUrl(quizId,level,redirect,courseTitle,unitTitle,lessonIdParam){
  var url='../shared/quiz.html?quiz='+encodeURIComponent(quizId)+'&level='+encodeURIComponent(level)+(redirect?'&redirect='+encodeURIComponent(redirect):'');
  if(courseTitle) url+='&course='+encodeURIComponent(courseTitle);
  if(unitTitle) url+='&unit_title='+encodeURIComponent(unitTitle);
  // Agent 2 (QUIZ-GATE): tells shared/quiz.html this quiz was launched
  // from its owning lesson's player, so the gate there doesn't bounce it
  // straight back here. Always pass the current lesson's id.
  if(lessonIdParam) url+='&lesson='+encodeURIComponent(lessonIdParam);
  return url;
}

if(!lessonId){
  renderError('No lesson was specified.');
  return;
}

// Optimization: lesson_ids always encode their level ("course-a1-unit-01-
// lesson-01"), so we can go straight to that level's small lessons file
// (course_content/lessons/<level>.json) instead of fetching the single
// monolithic course_content/lessons.json that bundles every level. Falls
// back to the ?level= query param, then to trying every level file, so a
// lesson_id that doesn't match the naming convention still resolves.
function levelFromLessonId(id){
  var m=/^course-(a1|a2|b1|b2|c1|c2)-/.exec(id||'');
  return m ? m[1] : null;
}
var idLevel=levelFromLessonId(lessonId);
var lessonsLevelGuess=idLevel||levelParam;
var lessonsFetch=lessonsLevelGuess
  ? fetchJson('../course_content/lessons/'+lessonsLevelGuess+'.json').then(function(arr){ return {level:lessonsLevelGuess,list:arr} })
  : Promise.reject(new Error('no level hint'));

lessonsFetch.catch(function(){
  // Last-resort fallback: scan every per-level file until one contains
  // this lesson_id (still far smaller in total than the old bundle, and
  // keeps old links without a level param working).
  return VALID_LEVELS.reduce(function(chain,lvl){
    return chain.then(function(found){
      if(found) return found;
      return fetchJson('../course_content/lessons/'+lvl+'.json').then(function(arr){
        var hit=(arr||[]).some(function(l){ return l.lesson_id===lessonId });
        return hit ? {level:lvl,list:arr} : null;
      }).catch(function(){ return null });
    });
  }, Promise.resolve(null));
}).then(function(found){
  if(!found){ renderError('This lesson isn\u2019t available yet.'); return }

  return Promise.all([
  fetchJson('../course_content/courses.json'),
  fetchJson('../course_content/units.json'),
  Promise.resolve(found.list)
]).then(function(results){
  var courses=results[0], units=results[1], lessons=results[2];
  var lesson=lessons.find(function(l){ return l.lesson_id===lessonId && l.status==='published' });
  if(!lesson){ renderError('This lesson isn\u2019t available yet.'); return }
  var unit=units.find(function(u){ return u.unit_id===lesson.unit_id });
  var course=unit ? courses.find(function(c){ return c.course_id===unit.course_id && c.status==='published' }) : null;
  if(!unit || !course){ renderError('This lesson isn\u2019t available yet.'); return }

  var level=levelParam || found.level || course.level.toLowerCase();
  // Sequential lesson gate: the first published lesson is open; every later
  // lesson requires the immediately previous lesson's final assessment to be
  // mastered (60%+). This also blocks direct lesson URLs.
  var ordered=(lessons||[]).filter(function(l){return l.status==='published'}).sort(function(a,b){
    var au=String(a.unit_id),bu=String(b.unit_id); if(au===bu)return (a.order||0)-(b.order||0); return au.localeCompare(bu);
  });
  var lessonPos=ordered.findIndex(function(l){return l.lesson_id===lesson.lesson_id});
  if(lessonPos>0){
    var previousLesson=ordered[lessonPos-1], progressNow=window.MylingoCourseProgress?window.MylingoCourseProgress.readProgress():{};
    var previousComplete=window.MylingoCourseProgress?window.MylingoCourseProgress.lessonIsComplete(previousLesson,progressNow):false;
    if(!previousComplete){ renderError('Finish the previous lesson first. Complete and pass “'+previousLesson.title+'” to unlock this lesson.'); return; }
  }

  if(window.MylingoLevelLock && window.MylingoLevelLock.isLocked(level)){
    renderError('This level is locked. Reach it from your current level to unlock it, or find your level first.');
    return;
  }

  return fetchJson('../'+level+'/quizzes.json').catch(function(){ return [] }).then(function(quizList){
    var quizMap={}; (quizList||[]).forEach(function(q){ quizMap[q.id]=q });

    document.title='Mylingo · '+lesson.title;

    var courseBack='../courses/course.html?level='+level+'&unit='+encodeURIComponent(unit.unit_id);
    var practiceReturnUrl='../courses/lesson.html?lesson='+encodeURIComponent(lesson.lesson_id)+'&level='+encodeURIComponent(level)+'&slide=practice';
    var backUrl=practiceReturnUrl;
    var exerciseIds=lesson.exercise_quiz_ids||[];
    var firstExercise=exerciseIds[0];
    var startUrl=firstExercise ? quizUrl(firstExercise,level,backUrl,course.title,unit.title,lesson.lesson_id) : null;
    var lessonQuizId=lesson.lesson_quiz_id;
    var lessonStartUrl=lessonQuizId ? quizUrl(lessonQuizId,level,startUrl||backUrl,course.title,unit.title,lesson.lesson_id) : null;

    var minutes=estimateMinutes(lesson.revision);
    var revision=lesson.revision||{};
    var hasSummary=!!(revision.summary && revision.summary.trim());
    var examples=(revision.examples||[]).filter(Boolean);
    var terms=(revision.key_terms||[]).filter(Boolean);
    var isOnline=('onLine' in navigator) ? navigator.onLine : true;

    var showCategoryChip=lesson.category && lesson.category.trim().toLowerCase()!==(unit.title||'').trim().toLowerCase();
    var headerHtml=
      '<div class="course-id"><span class="lvl-badge">'+esc(course.level)+'</span><span>'+esc(course.title)+'</span><span class="sep" aria-hidden="true">·</span><span class="unit-name">'+esc(unit.title)+'</span></div>'+
      '<div class="topline">'+(showCategoryChip?'<span class="chip">'+esc(lesson.category)+'</span>':'<span></span>')+
        (startUrl?'<a class="skipbtn" href="'+startUrl+'">Skip revision</a>':'')+
      '</div>'+
      '<h1>'+esc(lesson.title)+'</h1>'+
      '<p class="readtime"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg> ~'+minutes+' min read</p>';

    // ---- Slide deck: videos -> exactly three text slides -> audio -> practice.
    // Every published lesson gets a predictable three-part text sequence:
    // 1) intro/explanation, 2) usage/examples, 3) more details. Videos always
    // lead the lesson so the learner starts with the media experience.
    var bodyContent=lesson.body_content && String(lesson.body_content).trim();
    var chapters=Array.isArray(lesson.chapters)?lesson.chapters.filter(function(c){return c&&String(c.body_content||c.html||c.body||'').trim()}):[];
    if(chapters.length) bodyContent=chapters.map(function(ch){return '<h3>'+esc(ch.title||'')+'</h3>'+String(ch.body_content||ch.html||ch.body||'')}).join('');
    var media=mediaEntries(lesson);
    var slides=[];
    media.videos.forEach(function(entry,index){ slides.push({key:'video-'+index,label:entry.title||('Video '+(index+1)),kind:'video',html:headerHtml+renderMediaItem(entry,'video',lesson.title,isOnline,index)}); });
    splitIntoThreeTextSlides(bodyContent,revision).forEach(function(part,index){
      slides.push({key:'text-'+index,label:part.label,kind:'text',html:headerHtml+'<div class="card"><div class="lesson-content">'+part.html+'</div></div>'});
    });
    media.audios.forEach(function(entry,index){ slides.push({key:'audio-'+index,label:entry.title||('Audio '+(index+1)),kind:'audio',html:headerHtml+renderMediaItem(entry,'audio',lesson.title,isOnline,index)}); });
    var exercisesHtml='';
    var savedProgress=window.MylingoCourseProgress?window.MylingoCourseProgress.readProgress():{};
    if(exerciseIds.length){ exercisesHtml='<div class="card"><h2>Practice in this lesson</h2><p class="small" style="margin:0 0 12px;color:var(--muted)">Pass '+(window.MylingoCourseProgress&&window.MylingoCourseProgress.LESSON_COMPLETION_THRESHOLD||90)+'% of these quizzes to unlock the next lesson.</p><div class="exercise-cards">'+exerciseIds.map(function(id){var q=quizMap[id]||{};var title=q.title||id;var count=q.questions?String(q.questions)+' question'+(q.questions===1?'':'s'):'';var passed=window.MylingoCourseProgress&&window.MylingoCourseProgress.isMastered(savedProgress[id]);return '<a class="exercise-card'+(passed?' passed':'')+'" href="'+quizUrl(id,level,practiceReturnUrl,course.title,unit.title,lesson.lesson_id)+'"><div><h3>'+esc(title)+'</h3>'+(count?'<small>'+esc(count)+'</small>':'')+'</div><span class="status" aria-label="'+(passed?'Passed':'Not passed')+'">'+(passed?'✓':'○')+'</span><span class="chev" aria-hidden="true">→</span></a>';}).join('')+'</div></div>'; }
    else { exercisesHtml='<div class="card"><p class="summary">No exercises are linked to this lesson yet.</p></div>'; }
    slides.push({key:'practice',label:'Practice',kind:'practice',html:'<h1 class="sr-only">'+esc(lesson.title)+'</h1>'+exercisesHtml});

    var currentIndex=0;
    var maxReached=0; // furthest slide index reached so far; gates chapter-trail clicks below
    var videoWatchReady=false;
    var activeYoutubePlayer=null;
    var videoPollTimer=null;
    var videoPollStartedAt=0;
    var YTReadyQueue=window.__mylingoYTReadyQueue=window.__mylingoYTReadyQueue||[];
    function whenYouTubeReady(fn){
      if(window.YT&&window.YT.Player){fn();return;}
      YTReadyQueue.push(fn);
      if(!window.__mylingoYTCallbackInstalled){
        window.__mylingoYTCallbackInstalled=true;
        window.onYouTubeIframeAPIReady=function(){
          var q=window.__mylingoYTReadyQueue||[]; window.__mylingoYTReadyQueue=[];
          q.forEach(function(cb){try{cb()}catch(e){}});
        };
      }
    }
    function stopVideoTracking(){
      if(videoPollTimer){clearInterval(videoPollTimer);videoPollTimer=null;}
      if(activeYoutubePlayer&&typeof activeYoutubePlayer.destroy==='function'){try{activeYoutubePlayer.destroy()}catch(e){}}
      activeYoutubePlayer=null; videoPollStartedAt=0;
    }
    function unlockVideoNext(){
      if(videoWatchReady)return;
      videoWatchReady=true;
      var p=document.getElementById('video-progress'); if(p)p.textContent='90% watched · Continue unlocked.';
      renderNav();
    }
    function setupVideoSlide(slide){
      stopVideoTracking(); videoWatchReady=false;
      if(slide.kind!=='video')return;
      var iframe=document.querySelector('iframe');
      if(!iframe){unlockVideoNext();return;}
      if(('onLine' in navigator) && !navigator.onLine){unlockVideoNext();return;}
      var vid=youtubeId((media.videos[Number(slide.key.split('-')[1])]||{}).url);
      if(!vid)return;
      var watchedSeconds=0;
      var lastTime=null;
      var lastPoll=Date.now();
      var init=function(){
        if(!window.YT||!window.YT.Player)return;
        activeYoutubePlayer=new window.YT.Player(iframe.id,{videoId:vid,playerVars:{autoplay:1,mute:1,controls:1,disablekb:0,fs:1,iv_load_policy:3,rel:0,playsinline:1},events:{onReady:function(e){
          try{e.target.mute(); e.target.playVideo()}catch(x){}
          lastTime=Number(e.target.getCurrentTime())||0; lastPoll=Date.now();
          videoPollTimer=setInterval(function(){
            try{
              var now=Date.now(), elapsed=Math.min(1.25,Math.max(0,(now-lastPoll)/1000));
              var t=Number(e.target.getCurrentTime()), d=Number(e.target.getDuration());
              var state=Number(e.target.getPlayerState());
              if(d>0 && state===1 && Number.isFinite(t)){
                var delta=t-(lastTime==null?t:lastTime);
                // Credit only normal forward playback. Large jumps are seeks and
                // therefore do not count toward the 90% watch requirement.
                if(delta>0 && delta<=1.5) watchedSeconds=Math.min(d,watchedSeconds+Math.min(delta,elapsed*1.5));
                lastTime=t;
                if(watchedSeconds/d>=.9)unlockVideoNext();
              }else if(Number.isFinite(t)){
                lastTime=t;
              }
              lastPoll=now;
            }catch(x){}
          },250);
        },onStateChange:function(e){
          if(e.data===0)unlockVideoNext();
          if(e.data===1){try{lastTime=Number(e.target.getCurrentTime())||lastTime}catch(x){}}
        }}});
      };
      whenYouTubeReady(init);
    }
    var initialPractice=slides.findIndex(function(s){return s.key==='practice'});
    var savedCompletion=window.MylingoCourseProgress?window.MylingoCourseProgress.lessonCompletionRecord(lesson,savedProgress):{completed:false,progress:0};
    var lessonPassReady=!!savedCompletion.completed;
    var lastCtaHref=null;
    var lastCtaLabel=lessonPassReady?'Pass lesson & continue':'Pass lesson & continue';
    function refreshCompletionGate(){
      savedProgress=window.MylingoCourseProgress?window.MylingoCourseProgress.readProgress():{};
      savedCompletion=window.MylingoCourseProgress?window.MylingoCourseProgress.lessonCompletionRecord(lesson,savedProgress):{completed:false,progress:0};
      lessonPassReady=!!savedCompletion.completed;
      if(!lessonPassReady){lastCtaHref=null; renderNav(); return;}
      return fetchJson('../course_content/lessons/'+level+'.json').then(function(list){
        var ordered=(list||[]).filter(function(l){return l.status==='published'}).sort(function(a,b){var u=String(a.unit_id).localeCompare(String(b.unit_id));return u||((a.order||0)-(b.order||0));});
        var pos=ordered.findIndex(function(l){return l.lesson_id===lesson.lesson_id});
        var next=pos>=0?ordered[pos+1]:null;
        lastCtaHref=next?'../courses/lesson.html?lesson='+encodeURIComponent(next.lesson_id)+'&level='+encodeURIComponent(level)+'&slide=lesson':courseBack;
        lastCtaLabel=next?'Pass lesson & continue':'Finish lesson';
      }).catch(function(){lastCtaHref=courseBack;lastCtaLabel='Finish lesson';}).then(function(){renderNav();});
    }
    function trailIcon(kind){
      if(kind==='video')return TRAIL_ICON_VIDEO;
      if(kind==='practice')return TRAIL_ICON_QUIZ;
      if(kind==='audio')return TRAIL_ICON_AUDIO;
      return TRAIL_ICON_TEXT;
    }
    function renderTrail(){
      $('chapterTrail').innerHTML=slides.map(function(s,i){
        var cls='trail-item'+(i===currentIndex?' active':'')+(i<currentIndex?' done':'');
        var icon=trailIcon(s.kind); return '<button type="button" class="'+cls+'" data-idx="'+i+'"'+(i===currentIndex?' aria-current="step"':'')+(i>maxReached?' aria-disabled="true"':'')+' aria-label="Slide '+(i+1)+' of '+slides.length+': '+esc(s.label)+'"><span class="num">'+(i+1)+'</span><span class="type-icon" aria-hidden="true">'+icon+'</span><span>'+esc(s.label)+'</span></button>';
      }).join('');
      Array.prototype.forEach.call($('chapterTrail').querySelectorAll('.trail-item'),function(btn){
        btn.addEventListener('click',function(){
          var idx=Number(btn.getAttribute('data-idx'));
          if(idx<=maxReached) goToSlide(idx,true);
        });
      });
    }

    function renderNav(){
      var isLast=currentIndex===slides.length-1;
      var backHtml=currentIndex>0 ? '<button type="button" class="btn ghost" id="navBack">Back</button>' : '';
      var nextHtml;
      if(isLast){
        if(lessonPassReady && lastCtaHref){
          nextHtml='<a class="btn primary" id="navNext" href="'+lastCtaHref+'">'+esc(lastCtaLabel)+'</a>';
        }else{
          nextHtml='<button type="button" class="btn primary" id="navNext" disabled style="opacity:.5;cursor:not-allowed" title="Pass 90% of lesson quizzes first" aria-describedby="navHint">'+esc(lastCtaLabel)+'</button><span class="sr-only" id="navHint">Pass 90% of the lesson quizzes to unlock this.</span>';
        }
      } else if(slides[currentIndex].kind==='video' && !videoWatchReady){
        nextHtml='<span class="video-next-locked" role="status" aria-live="polite">Watch 90% to unlock Continue</span>';
      } else {
        nextHtml='<button type="button" class="btn primary" id="navNext">Continue</button>';
      }
      $('playerNav').innerHTML='<div class="player-nav-inner">'+backHtml+nextHtml+'</div>';
      var backBtn=$('navBack'); if(backBtn) backBtn.addEventListener('click',function(){ goToSlide(currentIndex-1,true) });
      var nextBtn=$('navNext'); if(nextBtn && !isLast) nextBtn.addEventListener('click',function(){ goToSlide(currentIndex+1,true) });
    }

    function goToSlide(idx,moveFocus){
      idx=Math.max(0,Math.min(slides.length-1,idx));
      currentIndex=idx;
      if(idx>maxReached) maxReached=idx;
      stopVideoTracking();
      $('content').innerHTML='<div class="slide '+(slides[idx].kind==='video'?'video-slide':'')+'" tabindex="-1" role="region" aria-label="Slide '+(idx+1)+' of '+slides.length+': '+esc(slides[idx].label)+'">'+slides[idx].html+'</div>';
      renderTrail();
      renderNav();
      setupVideoSlide(slides[idx]);
      renderNav();
      var reduce=false; try{reduce=typeof window.matchMedia==='function'&&window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
      window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
      if(moveFocus){var sl=$('content').querySelector('.slide'); if(sl&&typeof sl.focus==='function'){try{sl.focus({preventScroll:true})}catch(e){sl.focus()}}}
    }

    var startIndex=(requestedSlide==='practice'&&initialPractice>=0)?initialPractice:0;
    goToSlide(startIndex);
    refreshCompletionGate();

    window.addEventListener('offline',function(){
      var wrap=document.querySelector('.video-wrap');
      if(wrap) wrap.outerHTML='<div class="video-fallback">Video unavailable offline. Read the quick revision instead.</div>';
    });
  });
  });
}).catch(function(){ renderError('This lesson isn\u2019t available right now.') });
})();
</script>
<div class="player-nav" id="playerNav"></div>
</body></html>
