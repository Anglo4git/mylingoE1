# Mylingo — Netlify static hosting config
# See DEPLOY.md for the host decision rationale.
# No build step: this is a pre-built static HTML/CSS/JS tree.

[build]
  # Agent 16: only runtime files are published (tools/build-dist.js copies them byte-for-byte into dist/).
  # tests/, tools/, .github/, handoff *.md and result JSON are never served.
  publish = "dist"
  command = "node tools/build-dist.js"

# --- Cache policy -------------------------------------------------------
# There is no build/hash step (confirmed in STATE.md: no package.json,
# no bundler), so filenames never change on content updates. The service
# worker (sw.js) already owns freshness for the app shell and offline
# packs via CACHE_VERSION ("mylingo-v28" as of this commit) and its own
# cache-first / network-first split — see sw.js's header comment. Host-
# level caching below is intentionally conservative so it never fights
# the service worker's own revalidation logic. Full security/cache
# header policy (CSP, HSTS, etc.) is owned by STEP 5, not this step —
# these are placeholders sane enough to ship Step 2 without blocking on
# Step 5's full audit.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/offline/packs/*.zip"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/shared/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- HTTPS / TLS enforcement (STEP 4) -----------------------------------
# Netlify auto-provisions TLS (Let's Encrypt) for both the default
# *.netlify.app subdomain and any custom domain added later, and has a
# dashboard toggle ("Force HTTPS") that 301-redirects http:// -> https://
# automatically — that toggle is enabled by the site owner post-connect,
# not something this file can flip on its own. HSTS below is what this
# file CAN commit to ahead of time: once HTTPS is confirmed working (only
# checkable after a real deploy exists), the browser is told to always
# use HTTPS for this origin from then on, including on the very next
# visit before any redirect would even be needed.
#
# NOTE: HSTS lives in the single combined "/*" headers block below (with
# STEP 5's security headers), not its own block — Netlify does not
# guarantee how two separate [[headers]] blocks matching the identical
# path are merged, so every header for the "/*" path is kept in one place
# on purpose.

# --- Canonical domain redirect (STEP 4) ---------------------------------
# No custom domain has been provided yet (confirmed: nothing in this repo
# names one — see DEPLOY.md). Until one exists, the site is reachable
# only at its Netlify-assigned *.netlify.app subdomain, which needs no
# www/apex redirect (there is no "www" variant of a *.netlify.app name).
#
# The redirect below is a TEMPLATE, not active config — "example.com" is
# a placeholder, not a real domain, and this rule does nothing until the
# real hostnames replace it. Uncomment and edit once a domain is chosen;
# this redirects the www subdomain to the apex as the canonical form
# (apex-as-canonical is the more common convention, but swap the `from`
# and `to` lines to redirect the other direction if apex-as-alias is
# preferred instead):
#
# [[redirects]]
#   from = "https://www.example.com/*"
#   to = "https://example.com/:splat"
#   status = 301
#   force = true

# --- Agent 17 UPDATE: script-src no longer allows 'unsafe-inline' ---------
# The paragraph below (Step 5) is historical. The app has NO inline event-handler attributes (the
# `.onclick=` matches are JS property assignments, which CSP does not restrict), so script-src is now
# 'self' plus the SHA-256 of each inline <script> block, generated by tools/build-csp.js. A test fails
# when a script block changes without regenerating; run `node tools/build-csp.js` after editing any
# inline <script>. style-src keeps 'unsafe-inline' (91 style="" attributes + <style> blocks).
# --- Security + TLS headers, combined (STEP 4 HSTS + STEP 5) -----------
# Full rationale for every line below is in SECURITY.md — read that
# alongside this block, not instead of it. Summary: this app has zero
# external script/style/font/media dependencies (verified by grepping
# every HTML/JS file this session — see SECURITY.md's evidence section),
# so almost everything below is locked to 'self'. The two 'unsafe-inline'
# entries are not a shortcut: this app has 33 onclick= attributes and 91
# inline style= attributes across its 22 pages, neither of which CSP
# hashes/nonces can cover (only 'unsafe-inline', or the poorly-supported
# 'unsafe-hashes' extension, can allow an inline *event handler attribute*
# or *style attribute* — this is a CSP spec limitation, not a choice made
# here). Adding hash-sources for the <script> BLOCKS while leaving
# 'unsafe-inline' for the onclick attributes would actively break the
# onclick handlers in modern browsers, which ignore 'unsafe-inline' the
# moment any hash-source is present in the same directive — so plain
# 'unsafe-inline' was used deliberately, not by default.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-2uUjLFfxb7lNqOzhMFwSZo7lE8OSTVKKb1n9RCru2tA=' 'sha256-5hK3jd2gvdAt8gG3kTeqj2ofz9+7qoMjeRTuNd+VQl0=' 'sha256-C9G80HJi8aOHw1Uc8coFTZjXSJLaWPWm9vGrvPmrl6o=' 'sha256-CSQMyZOOKL4bFQ5ArDZUJgARWr++Al3Z73pX0JEAr34=' 'sha256-HmZhLqLZsVP+XHDtcqcq0z6oN8IYG9AXkzqT6yzIBWc=' 'sha256-KJEbwsQZD829YeIFNKFoLkafzeH+RoUCpyGiTfBIHbs=' 'sha256-Q2v421dETP32llZ7VFTXtkCnazrvS6E5fH2W8+FC23w=' 'sha256-QCndrJqov654T25aCDaJF9Z5YS5FYJPpyJcgJq0xtfw=' 'sha256-WidB0+vAyk4Jh0eRMy+cptsllcnkqnJghtMoPE0r8NE=' 'sha256-ct2uvKKb3VWaIO/S9G42H0mamWRxnw4gKobs1aVHXoI=' 'sha256-fRHJpAbrLvQhEVEmdH7DjfDhNQ7pPOkK86NUMYsb948=' 'sha256-hLkdvMRNBybel+xrm6vAaLaNT7vWTjYNBX7crits4AU=' 'sha256-hskdm9K8DG9B3eVhNc4VXHdHejvATDDtl/9IlgwtUfk=' 'sha256-sdUk2Mn/xCFYNa3JL/QrGt1Q5LVK/8OuVJEBSUBWO30=' 'sha256-yv6QHLUPNi35dZF3oxGF9un23tbsiRydOwsG1uLXeXU=' 'sha256-z4IAuBu8m7HmNgnIuhDf11G3Vp9GHJUOsDwD/Wenmtw='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), bluetooth=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=()"
    X-Frame-Options = "DENY"
